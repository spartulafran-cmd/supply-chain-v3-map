<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111c">
  <meta name="description" content="Сравнительная карта развития: проект «Товародвижение», Башня управления V2 и целевая V3.">
  <title>Товародвижение → Башня V2 → Целевая V3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span>ТР</span><div><b>Карта развития</b><small>Supply Chain · V3</small></div></div>
      <div class="title"><strong>Товародвижение <i>→</i> Башня V2 <i>→</i> Целевая V3</strong><span>Что было · что реализовано · что строим</span></div>
      <div class="hint">Выберите этап и контур</div>
    </header>

    <nav class="stage-nav" id="stageNav" aria-label="Этапы управленческого цикла"></nav>

    <nav class="contour-nav" id="contourNav" aria-label="Контуры управления">
      <button class="is-active" data-contour="operational"><i></i><span><b>Операционный контур</b><small>Сигнал → решение → факт</small></span></button>
      <button data-contour="kaizen"><i></i><span><b>Ежедневный Кайдзен</b><small>Повторы → Парето → эффект</small></span></button>
      <button data-contour="system"><i></i><span><b>Системный контур</b><small>Правила → процесс → стандарт</small></span></button>
    </nav>

    <section class="comparison" aria-labelledby="selectionTitle">
      <header class="selection-head"><div><span id="selectionMeta">Операционный контур · этап 01</span><h1 id="selectionTitle">Данные</h1></div><p id="selectionSummary"></p></header>
      <div class="mobile-versions" id="mobileVersions" aria-label="Версия"><button class="is-active" data-version="td">ТД</button><button data-version="v2">V2</button><button data-version="v3">V3</button></div>
      <div class="columns" id="columns"></div>
    </section>

    <footer class="legend">
      <b>Происхождение решений V3</b><span><i class="badge badge--td">ТД</i> из проекта</span><span><i class="badge badge--v2">V2</i> из Башни</span><span><i class="badge badge--both">ТД + V2</i> объединение</span><span><i class="badge badge--new">НОВОЕ V3</i> целевое развитие</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
