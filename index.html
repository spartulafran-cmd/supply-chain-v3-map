<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111d">
  <meta name="description" content="Интерактивная сравнительная карта проекта «Товародвижение», Башни V2 и целевой V3.">
  <title>Товародвижение → Башня V2 → Целевая V3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-head">
      <a class="brand" href="#" aria-label="Карта развития"><span>ТР</span><b>Карта развития</b></a>
      <div class="app-title"><strong>Товародвижение <i>→</i> Башня V2 <i>→</i> Целевая V3</strong><span>От операционного факта к обучающейся системе</span></div>
      <div class="view-switch" id="viewSwitch" role="group" aria-label="Показать версию">
        <button data-view="base">Товародвижение</button><button data-view="v2">Башня V2</button><button data-view="v3">V3</button><button class="is-active" data-view="all" aria-pressed="true">Сравнить</button>
      </div>
    </header>
    <nav class="stage-map" id="stageMap" aria-label="9 этапов управленческого цикла"></nav>
    <section class="workspace" id="comparison" aria-labelledby="focusTitle">
      <div class="focus-strip" aria-live="polite"><div><span>Выбранный этап</span><strong id="focusTitle">Данные</strong></div><p id="focusSummary"></p></div>
      <div class="comparison-grid" id="comparisonGrid" aria-live="polite"></div>
    </section>
    <footer class="context-bar">
      <div class="context-label"><span>Три контура управления</span><small>Меняют ракурс трёх колонок</small></div>
      <div class="context-tabs" id="contextTabs" role="tablist" aria-label="Контуры управления"><button role="tab" aria-selected="true" class="is-active" data-context="operational">Операционный</button><button role="tab" aria-selected="false" data-context="kaizen">Ежедневный Кайдзен</button><button role="tab" aria-selected="false" data-context="system">Системный</button></div>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
